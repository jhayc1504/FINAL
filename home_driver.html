<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver</title>
</head>

<style>
    *{
        padding: 0px;
        margin: 0px;
        box-sizing: border-box;
    }

    /* Desktop styles */
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #333;
        padding: 10px 20px;
    }

    /* Adjust hamburger and navMenu layout in navbar */
    .navbar .hamburger {
        display: none;
        flex-direction: column;
        cursor: pointer;
        margin-left: auto;
    }

    .branding {
        color: white;
        font-size: 24px;
        text-decoration: none;
    }

    .navMenu {
        list-style: none;
        display: flex;
    }

    .navMenu li {
        margin-left: 20px;
    }

    .navlink {
        color: white;
        text-decoration: none;
        font-size: 18px;
    }

    .navlink:hover {
        text-decoration: underline;
    }

    .bar {
        height: 3px;
        width: 25px;
        background-color: white;
        margin: 4px 0;
        border-radius: 2px;
        transition: 0.3s;
    }

    /* Mobile styles */
    @media (max-width: 768px) {
        .navMenu {
            position: fixed;
            top: 60px;
            right: -100%;
            height: 100vh;
            width: 200px;
            background-color: #333;
            flex-direction: column;
            align-items: start;
            padding-top: 20px;
            transition: right 0.3s ease-in-out;
            z-index: 10;
        }

        .navMenu.active {
            right: 0;
        }

        .navMenu li {
            margin: 15px 20px;
        }

        .navbar .hamburger {
            display: flex;
            margin-left: 20px;
        }

        /* Animate hamburger bars when active */
        .hamburger.active .bar:nth-child(1) {
            transform: rotate(45deg) translate(8px, 10px);
        }

        .hamburger.active .bar:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active .bar:nth-child(3) {
            transform: rotate(-45deg) translate(8px, -10px);
        }
    }
</style>

<body>
    <header>
        <nav class="navbar">
            <a href="home_driver.html" class="branding">PASADA.com</a>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <ul class="navMenu">
                <li>
                    <a href="#" class="navlink">Home</a>
                </li>

                <li>
                    <a href="driver_accept.html" class="navlink">Booking</a>
                </li>

                <li>
                    <a href="logout.php" class="navlink">Logout</a>
                </li>
            </ul>
        </nav>
    </header>

    <H1>Welcome to Pasada.com
        this is the driver homepage
    </H1>

    <div id="pendingBookings">
        <h2>Available Bookings</h2>
        <div id="bookingsList">
            <p>Loading...</p>
        </div>
    </div>

    <script>
        function loadPendingBookings() {
            fetch('get_all_pending_bookings.php')
                .then(response => response.json())
                .then(data => {
                    const listDiv = document.getElementById('bookingsList');
                    if (data.success && data.bookings.length > 0) {
                        let html = '';
                        data.bookings.forEach(booking => {
                            html += `
                                <div style="border: 1px solid #ccc; padding: 10px; margin: 10px 0;">
                                    <p><strong>Pickup:</strong> ${booking.pickup}</p>
                                    <p><strong>Destination:</strong> ${booking.destination}</p>
                                    <p><strong>Landmark:</strong> ${booking.landmark}</p>
                                    <p><strong>Commuter Type:</strong> ${booking.commuter_type}</p>
                                    <p><strong>Regular Passengers:</strong> ${booking.number_regular}</p>
                                    <p><strong>Student/SC/PWD Passengers:</strong> ${booking.number_student}</p>
                                    <p><strong>Estimated Fare:</strong> ₱${booking.estimatedFare}</p>
                                    <button onclick="acceptBooking(${booking.booking_id})">Accept</button>
                                </div>
                            `;
                        });
                        listDiv.innerHTML = html;
                    } else {
                        listDiv.innerHTML = '<p>No pending bookings available.</p>';
                    }
                })
                .catch(error => {
                    console.error('Error loading bookings:', error);
                    document.getElementById('bookingsList').innerHTML = '<p>Error loading bookings.</p>';
                });
        }

        function acceptBooking(bookingId) {
            // Calculate fare (same logic as before)
            fetch('get_all_pending_bookings.php')
                .then(response => response.json())
                .then(data => {
                    const booking = data.bookings.find(b => b.booking_id === bookingId);
                    if (booking) {
                        let fare = 0;
                        if (booking.commuter_type === 'Regular') {
                            fare = booking.number_regular * 20;
                        } else if (booking.commuter_type === 'Student/SC/PWD') {
                            fare = booking.number_student * 15;
                        } else if (booking.commuter_type === 'Both') {
                            fare = booking.number_regular * 20 + booking.number_student * 15;
                        }
                        // Update status to Accepted
                        fetch('update_booking_status.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ booking_id: bookingId, status: 'Accepted', fare: fare })
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                alert('Booking accepted!');
                                window.location.href = 'driver_accept.html';
                            } else {
                                alert('Error: ' + data.message);
                            }
                        });
                    }
                });
        }

        // Load bookings on page load
        loadPendingBookings();

        // Poll for new bookings every 5 seconds
        setInterval(loadPendingBookings, 1000);
    </script>
</body>
</html>
