<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Passenger Booking</title>
  
  <style>
      

    body { font-family: Arial; padding: 20px; }

    }

    input[type="text"] {

        background-color: navy;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

    #bookingDetails p {
      margin: 10px 0;
    }

    #actions {
      margin-top: 20px;
    }


    .navbar {
      display: flex;

      align-items: center;

      padding: 10px 20px;
    }


    .navbar .hamburger {
      display: none;

    }

    .branding {
      color: white;

    }

    .navMenu {
      list-style: none;

    }

    .navMenu li {

    }

    .navlink {
      color: white;

    }

    .navlink:hover {

    }

    .bar {

        }

    }

    .form{
      margin: 10px;
    }

    #commuterType {
      white-space: nowrap;    
    }

    #commuterType input[type="radio"] {
      margin: 0 12px 0 16px; 
    }

    .radio-group {
      display: flex;
      align-items: center;
      gap: 16px;        
      flex-wrap: wrap;   
}

    .radio-option {
      padding-top: 10px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;           
      cursor: pointer;    
    }

    .group-label {
      padding-top: 3px;
      font-weight: 600;
      margin-right: 4px;
    }


  </style>

</head>
<body>
  <header>
        <nav class="navbar">
            <a href="" class="branding">PASADA.com</a>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <ul class="navMenu">
                <li>
                    <a href="home_commuter.html" class="navlink">Home</a>
                </li>

                <li>
                    <a href="pass_booking.html" class="navlink">Booking</a>
                </li>

                <li>
                    <a href="logout.php" class="navlink">Logout</a>
                </li>
            </ul>
            <script src="script.js"></script>
        </nav>
    </header>
    <script src="script.js"></script>

    <div class="form">
        <h1 style="text-align: center;">Passenger Booking</h1>
        <label>
            Pickup Location:
            <input type="text" id="pickup" placeholder="e.g. 123 Rizal St">
        </label>
        <label>
            Landmark:
            <input type="text" id="mark" placeholder="e.g. front of CIT">
        </label>
        <label>
            Destination:
            <input type="text" id="destination" placeholder="e.g. P.Gomez">
        </label>

        <div class="radio-group">
          <span class="group-label">Commuter Type:</span>
            <label class="radio-option">
            <input type="radio" name="commuterType" value="Regular">
          <span>Regular</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="commuterType" value="Student/SC/PWD">
            <span>Student/SC/PWD</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="commuterType" value="Both">
            <span>Both</span>
          </label>
      </div>

        <div id="regularBoardingDiv" style="display:none;">
            <label>
                Number of Regular Passengers Boarding:
                <input type="number" id="regularBoarding" min="1" placeholder="e.g. 2">
            </label>
        </div>

        <div id="studentBoardingDiv" style="display:none;">
            <label>
                Number of Student/SC/PWD Passengers Boarding:
                <input type="number" id="studentBoarding" min="1" placeholder="e.g. 1">
            </label>
        </div>

        <button onclick="bookRide()">Book a Ride</button>
        <p id="status"></p>
    </div>

  <script>
    // Event listener for commuter type radio buttons
    document.querySelectorAll('input[name="commuterType"]').forEach(radio => {
      radio.addEventListener('change', function() {
        const type = this.value;
        document.getElementById('regularBoardingDiv').style.display = (type === 'Regular' || type === 'Both') ? 'block' : 'none';
        document.getElementById('studentBoardingDiv').style.display = (type === 'Student/SC/PWD' || type === 'Both') ? 'block' : 'none';
      });
    });

    function bookRide() {
      const pickup = document.getElementById('pickup').value;
      const destination = document.getElementById('destination').value;
      const mark = document.getElementById('mark').value;
      const fareSection = document.getElementById('fareSection');

      const commuterTypeElement = document.querySelector('input[name="commuterType"]:checked');
      if (!commuterTypeElement) {
        alert('Please select a commuter type.');
        return;
      }
      const commuterType = commuterTypeElement.value;

      const regularBoarding = parseInt(document.getElementById('regularBoarding').value) || 0;
      const studentBoarding = parseInt(document.getElementById('studentBoarding').value) || 0;

      if (!pickup || !destination) {
        alert('Please fill out pickup and destination.');
        return;
      }

      // Validate boarding numbers based on type
      if (commuterType === 'Regular' && regularBoarding <= 0) {
        alert('Please enter the number of regular passengers boarding.');
        return;
      }
      if (commuterType === 'Student/SC/PWD' && studentBoarding <= 0) {
        alert('Please enter the number of student/SC/PWD passengers boarding.');
        return;
      }
      if (commuterType === 'Both' && (regularBoarding <= 0 || studentBoarding <= 0)) {
        alert('Please enter the number of regular and student/SC/PWD passengers boarding.');
        return;
      }

      let estimatedFare = 0;
      if (commuterType === 'Regular') {
        estimatedFare = regularBoarding * 20;
      } else if (commuterType === 'Student/SC/PWD') {
        estimatedFare = studentBoarding * 15;
      } else if (commuterType === 'Both') {
        estimatedFare = regularBoarding * 20 + studentBoarding * 15;
      }

      const booking = {
        pickup,
        destination,
        mark,
        passengers: regularBoarding + studentBoarding,
        commuterType,
        regularBoarding,
        studentBoarding,
        estimatedFare,
        fareSection,
        status: "Pending"
      };

      localStorage.setItem('Booking', JSON.stringify(booking));
      document.getElementById('status').innerText = `Booking sent. Estimated fare: ₱${estimatedFare}. Waiting for driver...`;

      // Insert into database
      fetch('book_ride.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          pickup,
          destination,
          mark,
          commuterType,
          regularBoarding,
          studentBoarding,
          estimatedFare
        })
      }).then(response => response.json()).then(result => {
        if (result.success) {
          booking.booking_id = result.booking_id;
          localStorage.setItem('Booking', JSON.stringify(booking));
        } else {
          alert('Failed to save booking to database: ' + result.message);
        }
      }).catch(error => {
        console.error('Error saving to database:', error);
      });
    }

    setInterval(() => {
      const booking = JSON.parse(localStorage.getItem('Booking'));
      if (booking && booking.booking_id) {
        // Fetch latest status from DB
        fetch('get_booking_status.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ booking_id: booking.booking_id })
        })
          .then(response => response.json())
          .then(data => {
            if (data.success) {
              booking.status = data.booking.status;
              booking.fare = data.booking.fare;
              localStorage.setItem('Booking', JSON.stringify(booking));
            }
          })
          .catch(error => console.error('Error fetching status:', error));
      }

      if (booking?.status && booking.status !== "Pending" && booking.status !== "Completed") {
        let message = `Driver has ${booking.status.toLowerCase()} your request.`;

        if (booking.status === "Accepted") {
          message += `\nYou will need to pay ₱${booking.fare ? booking.fare : 'calculating...'}.`;
          // Add button to view active booking
          message += `<br><button onclick="window.location.href='active_booking.php'">View Active Booking</button>`;
        }
        document.getElementById('status').innerHTML = message;
      } else if (booking?.status === "Completed") {
        document.getElementById('status').innerHTML = "Booking completed.";
      }
    }, 1000);
  </script>
</body>
</html>
