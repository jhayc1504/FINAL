<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Driver Dashboard</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    button { margin-right: 10px; }

      body {
        
        font-family: Arial, sans-serif;
        background-color: white;
        color: black;
        padding: 40px;
        max-width: 600px;
        margin: auto;
        border-radius: 8px;
        box-shadow: 0 0 10px gray;
    }

    h1 {
        color: blue;
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 10px;
    }

    input[type="text"] {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-bottom: 15px;
        border: 1px solid silver;
        border-radius: 5px;
        box-sizing: border-box;
    }

    button {
        padding: 10px 20px;
        background-color: blue;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: navy;
    }

    #status {
        margin-top: 20px;
        font-weight: bold;
    }

    #bookingDetails p {
        margin: 10px 0;
    }

    #actions {
        margin-top: 20px;
    }
   
  </style>
</head>
<body>
  <h1>Booking- Driver</h1>
  <div id="bookingDetails">
    <p>No booking yet...</p>
  </div>



  <script>
    function loadBooking() {
      fetch('get_driver_active_booking.php')
        .then(response => response.json())
        .then(data => {
          const detailsDiv = document.getElementById('bookingDetails');

          if (data.success && data.booking) {
            const booking = data.booking;
            detailsDiv.innerHTML = `
              <p><strong>Pickup:</strong> ${booking.pickup}</p>
              <p><strong>Destination:</strong> ${booking.destination}</p>
              <p><strong>Landmark:</strong> ${booking.landmark}</p>
              <p><strong>Number of Passengers:</strong> ${booking.number_regular + booking.number_student}</p>
              <p><strong>Commuter Type:</strong> ${booking.commuter_type}</p>
              <p><strong>Regular Passengers Boarding:</strong> ${booking.number_regular}</p>
              <p><strong>Student/SC/PWD Passengers Boarding:</strong> ${booking.number_student}</p>
              <p><strong>Status:</strong> ${booking.status}</p>
              <p><strong>Fare:</strong> ₱${booking.fare}</p>
            `;
            // Add link to active booking
            detailsDiv.innerHTML += `<br><button onclick="window.location.href='driver_active_booking.html'">View Active Booking</button>`;
          } else {
            detailsDiv.innerHTML = "<p>No active booking.</p>";
          }
        })
        .catch(error => {
          console.error('Error loading booking:', error);
          document.getElementById('bookingDetails').innerHTML = "<p>Error loading booking.</p>";
        });
    }

    setInterval(loadBooking, 1000);
  </script>
</body>
</html>
